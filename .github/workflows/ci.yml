name: Schoolmusic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Unit Tests .NET 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}--nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}--nuget-
        
      - name: Restore dependencies
        run: dotnet restore schoolmusic-backend.sln
      
      - name: Build solution
        run: dotnet build schoolmusic-backend.sln --configuration Release --no-restore

      - name: Run xUnit test with code coverage
        run: dotnet test schoolmusic-backend.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload Cobertura coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn

  docker-verify:
    name: Verify Docker & Compose Build
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        run: docker build -t schoolmusic-backend:ci .

      - name: Validate docker-compose configuration
        run: docker compose config