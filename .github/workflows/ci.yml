name: Schoolmusic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Tests .NET 10 (incl. OpenAPI Contract)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}--nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}--nuget-

      - name: Restore dependencies
        run: dotnet restore schoolmusic-backend.sln

      - name: Build solution
        run: dotnet build schoolmusic-backend.sln --configuration Release --no-restore

      - name: Run xUnit tests (unit, integration & OpenAPI assertions)
        run: dotnet test schoolmusic-backend.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload Cobertura coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage.cobertura.xml"
          if-no-files-found: warn

  docker-verify:
    name: Verify Docker (amd64 & arm64) & Clean-Volume Compose
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      DB_ROOT_PASSWORD: ci-root-password-not-used-in-production
      DB_PASSWORD: ci-database-password-not-used-in-production
      REDIS_PASSWORD: ci-redis-password-not-used-in-production
      JWT_KEY: ci-jwt-key-with-at-least-32-bytes-not-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: schoolmusic-backend:ci-amd64

      - name: Build Docker Image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: schoolmusic-backend:ci-arm64

      - name: Validate docker-compose configuration
        run: docker compose config

      - name: Run clean-volume Docker Compose smoke test
        run: |
          chmod +x scripts/verify-compose.sh
          ./scripts/verify-compose.sh
