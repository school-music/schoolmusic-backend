services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: schoolmusic-ldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "Szkola"
      LDAP_DOMAIN: "szkola.edu.pl"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_CONFIG_PASSWORD: "configpassword"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./docs/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
